<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Manajemen Data Mahasiswa</h2>
        
        <!-- Form Input -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="formMahasiswa">
                    <input type="hidden" id="mahasiswaId">
                    <div class="row">
                        <div class="col-md-3">
                            <input type="text" id="nim" class="form-control" placeholder="NIM" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="nama" class="form-control" placeholder="Nama Lengkap" required>
                        </div>
                        <div class="col-md-3">
                            <input type="text" id="jurusan" class="form-control" placeholder="Jurusan" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100" id="btnSave">Simpan</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabel Data -->
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>No</th>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Jurusan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data akan dimuat dengan JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/mahasiswa';

        // Load data saat halaman dibuka
        document.addEventListener("DOMContentLoaded", loadData);

        // Fungsi GET Data (Read)
        async function loadData() {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            let html = '';
            data.forEach((mhs, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${mhs.nim}</td>
                        <td>${mhs.nama}</td>
                        <td>${mhs.jurusan}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editData(${mhs.id}, '${mhs.nim}', '${mhs.nama}', '${mhs.jurusan}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteData(${mhs.id})">Hapus</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('tableBody').innerHTML = html;
        }

        // Fungsi POST/PUT Data (Create/Update)
        document.getElementById('formMahasiswa').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('mahasiswaId').value;
            const payload = {
                nim: document.getElementById('nim').value,
                nama: document.getElementById('nama').value,
                jurusan: document.getElementById('jurusan').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // Reset form dan reload tabel
            document.getElementById('formMahasiswa').reset();
            document.getElementById('mahasiswaId').value = '';
            document.getElementById('btnSave').innerText = 'Simpan';
            loadData();
        });

        // Pindahkan data ke form untuk di-edit
        function editData(id, nim, nama, jurusan) {
            document.getElementById('mahasiswaId').value = id;
            document.getElementById('nim').value = nim;
            document.getElementById('nama').value = nama;
            document.getElementById('jurusan').value = jurusan;
            document.getElementById('btnSave').innerText = 'Update';
        }

        // Fungsi DELETE Data
        async function deleteData(id) {
            if(confirm('Yakin ingin menghapus data ini?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                loadData();
            }
        }
    </script>
</body>
</html>
